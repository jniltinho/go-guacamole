# GoGuacamole stack.
#   make up            app + guacd, SQLite on a named volume (default)
#   make up-mariadb    + MariaDB 11.4      (profile mariadb)
#   make up-postgres   + PostgreSQL 17     (profile postgres)
#   make up-lab        + SSH / VNC / RDP test targets (profile lab)
#   make up-tls        HTTPS on :8443 with ./deploy/certs (make certs)
# Configuration comes from .env (see .env.example); guacd is never published to the host.

name: goguacamole

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  APP_ADDR: ${APP_ADDR:-:8080}
  APP_BASE_URL: ${APP_BASE_URL:-}
  APP_LOG_FORMAT: ${APP_LOG_FORMAT:-json}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-}
  APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
  APP_ADMIN_USER: ${APP_ADMIN_USER:-admin}
  APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
  APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:-}
  DB_DRIVER: ${DB_DRIVER:-sqlite}
  DB_DSN: ${DB_DSN:-/data/goguacamole.db}
  GUACD_ADDR: guacd:4822
  TLS_ENABLED: ${TLS_ENABLED:-false}
  TLS_CERT_FILE: ${TLS_CERT_FILE:-}
  TLS_KEY_FILE: ${TLS_KEY_FILE:-}
  RECORDING_ENABLED: ${RECORDING_ENABLED:-true}
  RECORDING_PATH: /record
  RECORDING_INCLUDE_KEYS: ${RECORDING_INCLUDE_KEYS:-false}
  RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-90}
  # job queue (asynq): the redis service below, dedicated to this installation; empty to run upkeep in-process
  REDIS_ADDR: ${REDIS_ADDR-redis:6379}
  # object storage on private or plain-HTTP endpoints (e.g. the lab s3 service): OBJSTORE_ALLOWED_ENDPOINTS=s3
  OBJSTORE_ALLOWED_ENDPOINTS: ${OBJSTORE_ALLOWED_ENDPOINTS:-}
  OBJSTORE_ALLOW_HTTP: ${OBJSTORE_ALLOW_HTTP:-false}

services:
  app:
    image: ${IMAGE:-ghcr.io/jniltinho/go-guacamole}:${TAG:-latest}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - app-data:/data
      - guacd-record:/record
      - ./deploy/certs:/certs:ro
    # read (and purge) recordings written by guacd (uid/gid 1000, files 0640)
    group_add: ["1000"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
    depends_on:
      guacd:
        condition: service_started
      record-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: false
    networks: [guacnet]

  # gives the shared recordings volume to the guacd user (uid 1000) before guacd starts
  record-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown 1000:1000 /record && chmod 2770 /record"]
    volumes:
      - guacd-record:/record
    networks: [guacnet]

  # job queue for background work; no persistence (the database is the source of truth), internal network only
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:999" # the image's redis user: no gosu, so no SETUID/SETGID capability is needed
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "no"]
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [guacnet]

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    depends_on:
      record-init:
        condition: service_completed_successfully
    volumes:
      - guacd-record:/record
      - guacd-drive:/drive
    networks: [guacnet]

  mariadb:
    image: mariadb:11.4
    profiles: [mariadb]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: goguacamole
      MARIADB_USER: goguacamole
      MARIADB_PASSWORD: ${DB_PASSWORD:-goguacamole}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-goguacamole-root}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [guacnet]

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB: goguacamole
      POSTGRES_USER: goguacamole
      POSTGRES_PASSWORD: ${DB_PASSWORD:-goguacamole}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goguacamole -d goguacamole"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [guacnet]

  # ---- lab targets (tests / demos only) ----
  ssh-target:
    image: lscr.io/linuxserver/openssh-server:latest
    profiles: [lab]
    environment:
      PUID: "1000"
      PGID: "1000"
      PASSWORD_ACCESS: "true"
      USER_NAME: lab
      USER_PASSWORD: labpass123
    networks: [guacnet]

  vnc-target:
    image: consol/debian-xfce-vnc:latest
    profiles: [lab]
    environment:
      VNC_PW: labpass123
      VNC_RESOLUTION: 1280x800
    networks: [guacnet]

  rdp-target:
    image: scottyhardy/docker-remote-desktop:latest
    profiles: [lab]
    networks: [guacnet]

  # S3-compatible object storage for recording uploads (lab only; credentials from .env)
  s3:
    image: rustfs/rustfs:1.0.4
    profiles: [objstore]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-labs3key}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-labs3secret123}
    ports:
      - "127.0.0.1:${S3_PORT:-19300}:9000"
    networks: [guacnet]

networks:
  guacnet:

volumes:
  app-data:
  guacd-record:
  guacd-drive:
  mariadb-data:
  postgres-data:
