# GoGuacamole behind nginx (docker/README.md). Works as the nginx container of docker-compose.yml (upstream
# goguacamole:8080) or on the host (change the upstream to 127.0.0.1:8080 and the certificate paths).
#
# GoGuacamole must trust this proxy, so its access log, audit and history record the client's IP instead of nginx's:
#   APP_TRUSTED_PROXIES=10.249.49.20   (nginx container)  or  10.249.49.1  (nginx on the host, Docker gateway)
#   APP_BASE_URL=https://guac.example.com   APP_COOKIE_SECURE=true

upstream goguacamole {
    server goguacamole:8080;
    keepalive 16;
}

# WebSocket upgrade only when the client asks for it (the remote session tunnel)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# access log with the client's address and the request id goguacamole logs too
log_format goguacamole '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" rt=$request_time id=$request_id';

server {
    listen 80;
    listen [::]:80;
    server_name guac.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name guac.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/access.log goguacamole;

    # nginx itself behind a load balancer or CDN: take the client's IP from it (uncomment and set its network)
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header   X-Forwarded-For;
    # real_ip_recursive on;

    # API bodies are small (goguacamole limits them to 2 MB); files go through the tunnel
    client_max_body_size 4m;

    location / {
        proxy_pass http://goguacamole;
        proxy_http_version 1.1;

        # the client's IP and scheme for goguacamole (trusted only from APP_TRUSTED_PROXIES)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;

        # WebSocket (remote sessions)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # the remote session tunnel stays open for hours and streams the screen: no buffering, long timeouts
    location = /api/v1/tunnel {
        proxy_pass http://goguacamole;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering    off;
        proxy_read_timeout  12h;
        proxy_send_timeout  12h;
    }
}
