; GoGuacamole all-in-one: guacd, Redis and goguacamole in one container, logs on stdout (docker logs).
; supervisord starts as root only to drop every program to the guacd user (uid 1000), which owns /data.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; docker exec <container> supervisorctl status | restart goguacamole …
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; guacd only on loopback: goguacamole is the only client
[program:guacd]
command=/opt/guacamole/sbin/guacd -f -b 127.0.0.1 -l 4822 -L %(ENV_GUACD_LOG_LEVEL)s
user=guacd
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; job queue for background work (openspec add-async-jobs-object-storage); loopback only, no persistence:
; the database is the source of truth. Off with REDIS_EMBEDDED=false (external Redis in REDIS_ADDR).
[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --dir /tmp --protected-mode yes
user=guacd
priority=10
autostart=%(ENV_REDIS_AUTOSTART)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:goguacamole]
command=/usr/local/bin/goguacamole serve
user=guacd
environment=HOME="/data"
directory=/data
priority=20
startsecs=3
autorestart=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
