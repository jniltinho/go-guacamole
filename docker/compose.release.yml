# GoGuacamole all-in-one from the latest release (docker/README.md): no source build, ready in seconds.
# Same container as docker-compose.yml (guacd + goguacamole + Redis, data in ./data), with SQLite.
#
#   cd docker && docker compose -f compose.release.yml up -d --build
#   docker compose -f compose.release.yml logs goguacamole | grep password    # first start: admin password
#   open http://localhost:8080  (user admin; you are asked to change the password)
#
# Pin a release with RELEASE=v0.4.1; to update to a new release: docker compose -f compose.release.yml build --pull
name: goguacamole-release

services:
  goguacamole:
    build:
      context: .
      dockerfile: Dockerfile.release
      args:
        VERSION: ${RELEASE:-latest}
    image: goguacamole:allinone-release
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      APP_ENV: ${APP_ENV:-development}
      # the URL users type in the browser (also checked as the request Origin)
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_ADMIN_USER: ${APP_ADMIN_USER:-admin}
      # empty: a random password is generated on the first start and printed in the log
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      RECORDING_ENABLED: ${RECORDING_ENABLED:-true}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-90}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./data:/data
