<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="system-ui, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">GoGuacamole — detailed architecture</title>
  <desc id="description">Users access a Vue 3 SPA with guacamole-common-js over HTTP(S) and WS(S), directly or through an optional nginx reverse proxy. TLS can terminate at GoGuacamole or at the optional reverse proxy. The single GoGuacamole binary contains an Echo v5 HTTP API, WebSocket tunnel, authentication, access control, recording policy and player, asynq scheduler and worker, an embedded admin-only asynqmon dashboard at /asynqmon, rclone object storage integration and an egress proxy. GoGuacamole connects to guacd over TCP or TLS on port 4822 using the Guacamole protocol. guacd connects to remote RDP, SSH and VNC servers. guacd writes a shared recordings volume that GoGuacamole reads and purges. GoGuacamole exchanges data with a SQL database and Redis asynq queues. The embedded asynqmon dashboard reads Redis queues. External identity providers connect to Auth. The egress proxy connects to external object storage providers.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#1e4fd8"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b"/>
    </marker>
    <style>
      text { fill: #0b1b3a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #64748b; }
      .boundary { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 7 6; }
      .app-boundary { stroke: #1e4fd8; stroke-width: 1.8; }
      .group-title { font-size: 21px; font-weight: 650; }
      .app-title { font-size: 25px; font-weight: 700; fill: #1e4fd8; }
      .caption { font-size: 14px; font-weight: 650; letter-spacing: 1.2px; fill: #64748b; }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .module { fill: #ffffff; stroke: #1e4fd8; stroke-width: 1.5; }
      .optional { stroke-dasharray: 5 4; }
      .name { font-size: 20px; font-weight: 650; }
      .detail { font-size: 15px; fill: #64748b; }
      .small { font-size: 14px; fill: #64748b; }
      .label { font-size: 14px; fill: #64748b; }
      .blue-label { fill: #1e4fd8; }
      .backplate { fill: #ffffff; }
      .flow { fill: none; stroke: #1e4fd8; stroke-width: 2.2; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .service-flow { fill: none; stroke: #64748b; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow-gray); }
      .two-way { marker-start: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="32" y="49" class="title">GoGuacamole architecture</text>
  <text x="32" y="79" class="subtitle">Remote access, identity, recordings and background services</text>

  <!-- Deployment and service boundaries. -->
  <g aria-label="Architecture groups">
    <rect x="32" y="112" width="320" height="320" rx="18" class="boundary"/>
    <rect x="400" y="112" width="580" height="820" rx="18" class="boundary app-boundary"/>
    <rect x="1032" y="112" width="536" height="820" rx="18" class="boundary"/>
    <rect x="32" y="474" width="320" height="458" rx="18" class="boundary"/>
    <text x="56" y="147" class="group-title">Client</text>
    <text x="424" y="149" class="app-title">GoGuacamole</text>
    <text x="424" y="178" class="subtitle">Single Go binary</text>
    <text x="1056" y="147" class="group-title">Infrastructure</text>
    <text x="1056" y="177" class="detail">Session broker &amp; shared services</text>
    <text x="56" y="506" class="group-title">External services</text>
    <text x="424" y="278" class="caption">REQUEST &amp; SESSION PATH</text>
    <text x="1056" y="278" class="caption">REMOTE ACCESS</text>
  </g>

  <!-- Orthogonal connectors are drawn before component cards. -->
  <g aria-label="Connections">
    <!-- Browser to optional TLS proxy, API, tunnel, guacd and servers. -->
    <path d="M 190 254 V 302" class="flow"/>
    <path d="M 312 350 H 424" class="flow"/>
    <path d="M 666 350 H 710" class="flow"/>
    <path d="M 956 350 H 1102" class="flow"/>
    <path d="M 1260 350 H 1360" class="flow"/>

    <!-- External identity and recording storage. -->
    <path d="M 324 588 H 424" class="service-flow two-way"/>
    <path d="M 1181 398 V 490" class="service-flow"/>
    <path d="M 956 538 H 1134" class="service-flow"/>

    <!-- Application persistence and background queues. -->
    <path d="M 980 690 H 1134" class="service-flow two-way"/>
    <path d="M 956 846 H 1090" class="service-flow two-way"/>
    <path d="M 956 718 H 1008 V 780 H 1184 V 806" class="service-flow"/>

    <!-- rclone traffic is routed through the egress proxy. -->
    <path d="M 545 754 V 812" class="service-flow"/>
    <path d="M 424 852 H 324" class="service-flow"/>
  </g>

  <!-- Backplates keep connector labels clear of dashed group boundaries. -->
  <g aria-label="Connection labels">
    <text x="208" y="284" class="label blue-label">HTTP(S) / WS(S)</text>
    <rect x="314" y="320" width="108" height="21" rx="4" class="backplate"/>
    <text x="368" y="335" text-anchor="middle" class="label blue-label">HTTP(S) / WS(S)</text>
    <rect x="958" y="301" width="142" height="37" rx="4" class="backplate"/>
    <text x="1029" y="316" text-anchor="middle" class="label blue-label">Guacamole protocol</text>
    <text x="1029" y="334" text-anchor="middle" class="label blue-label">TCP/TLS 4822</text>
    <rect x="330" y="561" width="88" height="21" rx="4" class="backplate"/>
    <text x="374" y="576" text-anchor="middle" class="label">Auth / MFA</text>
    <text x="1197" y="449" class="label">writes</text>
    <rect x="985" y="510" width="120" height="21" rx="4" class="backplate"/>
    <text x="1045" y="525" text-anchor="middle" class="label">reads / purges</text>
    <rect x="991" y="663" width="132" height="21" rx="4" class="backplate"/>
    <text x="1057" y="678" text-anchor="middle" class="label">SQL · read / write</text>
    <rect x="995" y="819" width="56" height="21" rx="4" class="backplate"/>
    <text x="1023" y="834" text-anchor="middle" class="label">asynq</text>
    <text x="1096" y="771" text-anchor="middle" class="label">reads queues</text>
    <text x="560" y="790" class="label">outbound</text>
    <rect x="341" y="824" width="66" height="21" rx="4" class="backplate"/>
    <text x="374" y="839" text-anchor="middle" class="label">HTTPS</text>
  </g>

  <!-- Client. -->
  <g aria-label="Users and browser">
    <rect x="68" y="174" width="244" height="80" rx="12" class="node"/>
    <text x="190" y="201" text-anchor="middle" class="name">Users / Browser</text>
    <text x="190" y="224" text-anchor="middle" class="detail">Vue 3 SPA</text>
    <text x="190" y="244" text-anchor="middle" class="small">guacamole-common-js</text>
  </g>
  <g aria-label="Optional nginx reverse proxy">
    <rect x="68" y="302" width="244" height="96" rx="12" class="node optional"/>
    <text x="190" y="340" text-anchor="middle" class="name">nginx</text>
    <text x="190" y="369" text-anchor="middle" class="small">Optional reverse proxy · TLS</text>
  </g>

  <!-- Modules inside the single Go binary. -->
  <g aria-label="Access control">
    <rect x="710" y="194" width="246" height="78" rx="12" class="module"/>
    <text x="833" y="225" text-anchor="middle" class="name">Access control</text>
    <text x="833" y="251" text-anchor="middle" class="small">users · groups · folders</text>
  </g>
  <g aria-label="HTTP API">
    <rect x="424" y="302" width="242" height="96" rx="12" class="module"/>
    <text x="545" y="341" text-anchor="middle" class="name">HTTP API</text>
    <text x="545" y="370" text-anchor="middle" class="detail">Echo v5</text>
  </g>
  <g aria-label="WebSocket tunnel">
    <rect x="710" y="302" width="246" height="96" rx="12" class="module"/>
    <text x="833" y="341" text-anchor="middle" class="name">WebSocket tunnel</text>
    <text x="833" y="370" text-anchor="middle" class="detail">Remote session stream</text>
  </g>
  <g aria-label="Authentication">
    <rect x="424" y="532" width="242" height="112" rx="12" class="module"/>
    <text x="545" y="564" text-anchor="middle" class="name">Auth</text>
    <text x="545" y="594" text-anchor="middle" class="small">local · LDAP / AD</text>
    <text x="545" y="620" text-anchor="middle" class="small">OIDC · SAML · TOTP · Duo</text>
  </g>
  <g aria-label="Recording policy and player">
    <rect x="710" y="490" width="246" height="96" rx="12" class="module"/>
    <text x="833" y="528" text-anchor="middle" class="name">Recording policy</text>
    <text x="833" y="557" text-anchor="middle" class="detail">&amp; player</text>
  </g>
  <g aria-label="Object storage integration">
    <rect x="424" y="678" width="242" height="76" rx="12" class="module"/>
    <text x="545" y="708" text-anchor="middle" class="name">Object storage</text>
    <text x="545" y="735" text-anchor="middle" class="detail">rclone</text>
  </g>
  <g aria-label="Egress proxy">
    <rect x="424" y="812" width="242" height="80" rx="12" class="module"/>
    <text x="545" y="843" text-anchor="middle" class="name">Egress proxy</text>
    <text x="545" y="870" text-anchor="middle" class="small">Outbound storage traffic</text>
  </g>
  <g aria-label="Job scheduler and worker">
    <rect x="710" y="796" width="246" height="96" rx="12" class="module"/>
    <text x="833" y="828" text-anchor="middle" font-size="19" font-weight="650">Job scheduler / worker</text>
    <text x="833" y="861" text-anchor="middle" class="detail">asynq</text>
  </g>
  <g aria-label="Embedded admin asynqmon dashboard">
    <rect x="710" y="644" width="246" height="112" rx="12" class="module"/>
    <text x="833" y="673" text-anchor="middle" class="name">asynqmon</text>
    <text x="833" y="703" text-anchor="middle" class="detail">Embedded admin dashboard</text>
    <text x="833" y="732" text-anchor="middle" class="small">/asynqmon</text>
  </g>

  <!-- Infrastructure. -->
  <g aria-label="guacd">
    <rect x="1102" y="302" width="158" height="96" rx="12" class="node"/>
    <text x="1181" y="343" text-anchor="middle" class="name">guacd</text>
    <text x="1181" y="371" text-anchor="middle" class="detail">Session broker</text>
  </g>
  <g aria-label="Remote servers">
    <rect x="1360" y="302" width="184" height="96" rx="12" class="node"/>
    <text x="1452" y="341" text-anchor="middle" font-size="18" font-weight="650">Remote servers</text>
    <text x="1452" y="370" text-anchor="middle" class="small">RDP · SSH · VNC</text>
  </g>
  <g aria-label="Shared recordings volume">
    <rect x="1134" y="490" width="410" height="96" rx="12" class="node"/>
    <text x="1339" y="527" text-anchor="middle" class="name">Recordings volume</text>
    <text x="1339" y="556" text-anchor="middle" class="detail">Shared by guacd and GoGuacamole</text>
  </g>
  <g aria-label="Database">
    <rect x="1134" y="634" width="410" height="112" rx="12" class="node"/>
    <text x="1339" y="662" text-anchor="middle" class="name">Database</text>
    <text x="1339" y="688" text-anchor="middle" class="detail">SQLite · MariaDB · PostgreSQL</text>
    <text x="1339" y="711" text-anchor="middle" class="small">users · permissions · history</text>
    <text x="1339" y="732" text-anchor="middle" class="small">audit · leases</text>
  </g>
  <g aria-label="Redis queues">
    <rect x="1090" y="806" width="188" height="80" rx="12" class="node"/>
    <text x="1184" y="837" text-anchor="middle" class="name">Redis</text>
    <text x="1184" y="864" text-anchor="middle" class="detail">asynq queues</text>
  </g>

  <!-- External identity and storage providers. -->
  <g aria-label="Identity providers">
    <rect x="56" y="532" width="268" height="112" rx="12" class="node"/>
    <text x="190" y="564" text-anchor="middle" class="name">Identity providers</text>
    <text x="190" y="594" text-anchor="middle" class="small">LDAP / AD · OIDC · SAML</text>
    <text x="190" y="620" text-anchor="middle" class="small">Duo</text>
  </g>
  <g aria-label="Object storage providers">
    <rect x="56" y="772" width="268" height="120" rx="12" class="node"/>
    <text x="190" y="803" text-anchor="middle" class="name">Object storage</text>
    <text x="190" y="832" text-anchor="middle" class="small">AWS S3 · S3-compatible</text>
    <text x="190" y="855" text-anchor="middle" class="small">Oracle Cloud</text>
    <text x="190" y="878" text-anchor="middle" class="small">Google Cloud Storage</text>
  </g>

  <text x="32" y="974" class="small">Dashed boxes: logical groups. Dashed nginx card: optional deployment component. TLS can terminate at GoGuacamole or at the optional reverse proxy.</text>
</svg>
