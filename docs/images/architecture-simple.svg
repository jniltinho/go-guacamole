<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="system-ui, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">GoGuacamole — simple architecture</title>
  <desc id="description">A Vue 3 browser application connects over HTTP(S) and WS(S) to a single GoGuacamole binary. GoGuacamole connects to guacd using the Guacamole protocol. guacd connects to RDP, SSH and VNC servers. GoGuacamole uses a SQLite, MariaDB or PostgreSQL database.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#1e4fd8"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b"/>
    </marker>
    <style>
      text { fill: #0b1b3a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #64748b; }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .primary-node { fill: #1e4fd8; stroke: #1e4fd8; stroke-width: 2; }
      .name { font-size: 21px; font-weight: 650; }
      .detail { font-size: 16px; fill: #64748b; }
      .protocols { font-size: 14px; fill: #64748b; }
      .database-options { font-size: 15px; fill: #64748b; }
      .white { fill: #ffffff; }
      .edge-label { font-size: 14px; fill: #1e4fd8; }
      .flow { fill: none; stroke: #1e4fd8; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .data-flow { fill: none; stroke: #64748b; stroke-width: 2; marker-start: url(#arrow-gray); marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="32" y="48" class="title">GoGuacamole architecture</text>
  <text x="32" y="77" class="subtitle">Browser-based access to remote servers</text>

  <!-- Connections are painted before the opaque component cards. -->
  <g aria-label="Connections">
    <path d="M 228 194 H 388" class="flow"/>
    <path d="M 640 194 H 832" class="flow"/>
    <path d="M 972 194 H 1040" class="flow"/>
    <path d="M 514 244 V 314" class="data-flow"/>
    <text x="308" y="177" text-anchor="middle" class="edge-label">HTTP(S) / WS(S)</text>
    <text x="736" y="177" text-anchor="middle" class="edge-label">Guacamole protocol</text>
    <text x="531" y="285" class="subtitle">SQL</text>
  </g>

  <g aria-label="Browser">
    <rect x="32" y="144" width="196" height="100" rx="14" class="node"/>
    <text x="130" y="185" text-anchor="middle" class="name">Browser</text>
    <text x="130" y="214" text-anchor="middle" class="detail">Vue 3 SPA</text>
  </g>
  <g aria-label="GoGuacamole">
    <rect x="388" y="144" width="252" height="100" rx="14" class="primary-node"/>
    <text x="514" y="185" text-anchor="middle" class="name white">GoGuacamole</text>
    <text x="514" y="214" text-anchor="middle" class="detail white">Single Go binary</text>
  </g>
  <g aria-label="guacd">
    <rect x="832" y="144" width="140" height="100" rx="14" class="node"/>
    <text x="902" y="201" text-anchor="middle" class="name">guacd</text>
  </g>
  <g aria-label="Remote servers">
    <rect x="1040" y="144" width="128" height="100" rx="14" class="node"/>
    <text x="1104" y="185" text-anchor="middle" class="name">Servers</text>
    <text x="1104" y="214" text-anchor="middle" class="protocols">RDP · SSH · VNC</text>
  </g>
  <g aria-label="Database">
    <rect x="364" y="314" width="300" height="78" rx="14" class="node"/>
    <text x="514" y="345" text-anchor="middle" class="name">Database</text>
    <text x="514" y="373" text-anchor="middle" class="database-options">SQLite · MariaDB · PostgreSQL</text>
  </g>
</svg>
