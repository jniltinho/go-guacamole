# CI: every push and pull request — Go format/vet/tests on SQLite, MariaDB and PostgreSQL,
# and the frontend check, type-check, unit tests and build. Reused by docker-image-publish.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  TZ: America/Sao_Paulo

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gg
        ports: ["13306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: gg
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend check, type-check, tests and build (→ web/dist)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run typecheck
          npm run test
          npm run build
      - name: Go format, vet and tests (SQLite + MariaDB + PostgreSQL)
        env:
          TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:13306)/gg
          TEST_POSTGRES_DSN: postgres://postgres:pg@127.0.0.1:15432/gg?sslmode=disable
        run: |
          test -z "$(gofmt -l cmd internal e2e main.go)" || { gofmt -l cmd internal e2e main.go; exit 1; }
          go vet ./...
          go vet -tags e2e ./e2e/...
          go test -race ./... -count=1
      - name: Single static binary
        run: CGO_ENABLED=0 go build -trimpath -o bin/goguacamole . && ./bin/goguacamole version
