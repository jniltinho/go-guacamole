name: Docker image

# Pull requests: CI + image build only. main and v* tags: CI, then the end-to-end suites against the
# compose lab stack (API/tunnel on SQLite / MariaDB / PostgreSQL + Playwright on SSH/VNC/RDP), and only then the linux/amd64
# image is pushed to ghcr.io/<owner>/go-guacamole (`main`, `sha-<short>`, `X.Y.Z`, `X.Y`, `latest`)
# with the workflow's own token — no registry secrets.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  e2e:
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: API + tunnel e2e on SQLite, MariaDB and PostgreSQL
        run: |
          ./deploy/e2e.sh sqlite
          ./deploy/e2e.sh mysql
          ./deploy/e2e.sh postgres
      - name: Browser e2e (Playwright, Chromium + Firefox) on SSH / VNC / RDP lab targets
        run: |
          (cd frontend && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium firefox)
          ./deploy/e2e.sh browser

  image:
    name: Build and push
    needs: [ci, e2e]
    if: always() && needs.ci.result == 'success' && (needs.e2e.result == 'success' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
